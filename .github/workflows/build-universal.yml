name: Build zitch (aarch64)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            cache-cargo
            target
          key: cargo-aarch64-${{ hashFiles('Cargo.lock', 'spruce/Dockerfile') }}-${{ github.sha }}
          restore-keys: cargo-aarch64-${{ hashFiles('Cargo.lock', 'spruce/Dockerfile') }}-

      - name: Build Docker image
        run: docker build -t zitch-builder spruce

      - name: Build zitch
        run: |
          mkdir -p output cache-cargo
          docker run --rm \
            -e ZITCH_VERSION=spruce-${GITHUB_SHA::7} \
            -e CARGO_HOME=/cache/cargo \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/output:/output \
            -v ${{ github.workspace }}/cache-cargo:/cache/cargo \
            zitch-builder

      - name: Upload App folder
        run: sudo tar -czf zitch-aarch64.tar.gz -C output App

      - uses: actions/upload-artifact@v4
        with:
          name: zitch-aarch64
          path: zitch-aarch64.tar.gz
