name: Sync master with upstream

# master carries itchio/zitch's files minus its .github/workflows, one commit
# per sync. Upstream's workflows are left out because the default token may
# not push workflow changes, and spruce builds with its own.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Copy upstream into master
        run: |
          set -e
          git remote add upstream https://github.com/itchio/zitch.git
          git fetch upstream master
          UP=$(git rev-parse --short upstream/master)
          git rm -rq --cached -- . ':!.github/workflows'
          git checkout upstream/master -- . ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "master already matches upstream $UP"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync upstream $UP"
          git push origin HEAD:master
