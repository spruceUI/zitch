name: Build All

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  universal:
    uses: ./.github/workflows/build-universal.yml

  armhf:
    uses: ./.github/workflows/build-armhf.yml

  package:
    needs: [universal, armhf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zitch-*

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create "$TAG" --repo ${{ github.repository }} \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "zitch binaries built from ${{ github.ref_name }}" \
            || true

      # The 64-bit App folder with the 32-bit build in App/zitch/zitch32.
      - name: Upload zitch-spruce.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          tar -xzf zitch-aarch64/zitch-aarch64.tar.gz -C out
          tar -xzf zitch-armhf/zitch-armhf.tar.gz -C out
          cd out
          zip -qr ../zitch-spruce.zip App
          cd ..
          gh release upload "beta-${{ github.ref_name }}" zitch-spruce.zip --clobber --repo ${{ github.repository }}
