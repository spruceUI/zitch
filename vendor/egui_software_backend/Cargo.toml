[package]
name = "egui_software_backend"
description = "A CPU software render backend for egui."
version = "0.0.3"
edition = "2024"
repository = "https://github.com/DGriffin91/egui_software_backend"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
egui = { version = "0.36", default-features = false }
strength_reduce = "0.2.4"
constify = { path = "constify", version = "0.0.1" }
ahash = { version = "0.8", default-features = false, features = ["no-rng"] }
rayon = { version = "1.11.0", optional = true }
log = { version = "0.4", optional = true }

[features]
default = ["std"]
std = ["ahash/std"]
log = ["dep:log"]
rayon = ["dep:rayon"]
raster_stats = ["std"]
